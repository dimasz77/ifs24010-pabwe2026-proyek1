<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c3b4a" />
    <meta name="description" content="Jenika Rental - sistem pengelolaan rental sepeda motor di kawasan Samosir" />
    <title>Jenika Rental - Rental Motor Samosir</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #edf2f1; color: #172229; font-family: "Segoe UI", system-ui, sans-serif; }
      .public-home { min-height: 100vh; display: flex; flex-direction: column; }
      .public-home-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 20px clamp(20px, 6vw, 88px); background: #fff; border-bottom: 1px solid #d5dedc; }
      .public-home-brand { color: #0c3b4a; font-size: 1.35rem; font-weight: 700; text-decoration: none; }
      .public-home-header nav, .public-home-actions { display: flex; align-items: center; gap: 12px; }
      .public-home-main { width: min(760px, 100%); margin: auto; padding: 72px 24px 96px; text-align: center; }
      .public-home-eyebrow { color: #a3161f; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .public-home-main h1 { margin: 14px 0 0; font-size: clamp(2.2rem, 6vw, 4.2rem); line-height: 1.15; }
      .public-home-description { max-width: 54ch; margin: 18px auto 0; color: #4b5960; font-size: 1.15rem; }
      .public-home-actions { justify-content: center; flex-wrap: wrap; margin-top: 28px; }
      .public-home-places { margin-top: 44px; color: #4b5960; font-size: 0.9rem; }
      .boot-link { color: #0c3b4a; text-decoration: none; }
      .boot-button { display: inline-flex; align-items: center; justify-content: center; padding: 10px 16px; border: 1.5px solid #a3161f; border-radius: 6px; background: #a3161f; color: #fff; font-weight: 600; text-decoration: none; white-space: nowrap; }
      .boot-button-secondary { border-color: #d5dedc; background: #fff; color: #172229; }
      @media (max-width: 800px) {
        .public-home-header { padding: 16px 20px; }
        .public-home-main { padding-top: 56px; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="public-home">
        <header class="public-home-header">
          <a class="public-home-brand" href="/">Jenika Rental</a>
          <nav aria-label="Navigasi utama">
            <a class="boot-link" href="/auth/login">Masuk</a>
            <a class="boot-button" href="/auth/register">Buat akun</a>
          </nav>
        </header>
        <main class="public-home-main">
          <p class="public-home-eyebrow">Rental motor Samosir</p>
          <h1>Kelola penyewaan motor dengan lebih mudah.</h1>
          <p class="public-home-description">
            Catat armada, pelanggan, dan transaksi penyewaan Jenika Rental dalam satu aplikasi.
          </p>
          <div class="public-home-actions">
            <a class="boot-button" href="/auth/register">Mulai sekarang</a>
            <a class="boot-button boot-button-secondary" href="/auth/login">Masuk ke akun</a>
          </div>
          <p class="public-home-places">Melayani Tomok, Tuktuk, Ambarita, Pangururan, dan Simanindo.</p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
