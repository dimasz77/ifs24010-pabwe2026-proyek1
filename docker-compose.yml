# Menjalankan frontend:  docker compose up -d --build  ->  http://localhost:8080
# Isi VITE_API_URL dengan URL backend (contoh: http://localhost:4000) lewat file .env atau environment.
services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:4000}"
    image: rental-motor-samosir-frontend:latest
    container_name: rental-motor-samosir-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
